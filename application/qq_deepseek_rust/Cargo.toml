[workspace]
members = ["crates/protocol-core"]
resolver = "2"

[package]
name = "qq-deepseek-firmware"
version = "0.7.0"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "qq-deepseek-firmware"
path = "src/main.rs"
harness = false

[features]
default = []
bot = []

[dependencies]
esp-idf-svc = { version = "=0.53.0", default-features = true }
log = { version = "0.4", features = ["max_level_info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qq-deepseek-core = { path = "crates/protocol-core" }

[build-dependencies]
embuild = "=0.33.5"

[profile.dev]
opt-level = "s"
debug = true

[profile.release]
opt-level = "s"
debug = true
lto = "thin"
codegen-units = 1

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_websocket_client", version = "1.8.0" }
bindings_header = "src/bot/ws_bindings.h"
bindings_module = "ws"
