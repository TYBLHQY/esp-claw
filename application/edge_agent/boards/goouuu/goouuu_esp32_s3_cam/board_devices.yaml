version: 1.0.0

devices:
  # OV2640 connected over an 8-bit DVP bus. The sensor power rails are always
  # enabled on this board, so PWDN and RESET are not connected to GPIOs.
  - name: camera
    type: camera
    sub_type: dvp
    version: default
    config:
      dvp_config:
        reset_io: -1
        pwdn_io: -1
        vsync_io: 6
        de_io: 7
        pclk_io: 13
        xclk_io: 15
        xclk_freq: 20000000
        data_width: CAM_CTLR_DATA_WIDTH_8
        data_io:
          data_io_0: 11
          data_io_1: 9
          data_io_2: 8
          data_io_3: 10
          data_io_4: 12
          data_io_5: 18
          data_io_6: 17
          data_io_7: 16
    peripherals:
      - name: i2c_master
        frequency: 100000

  # On-board microSD slot wired in 1-bit SDMMC mode.
  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    version: default
    config:
      mount_point: "/sdcard"
      vfs_config:
        format_if_mount_failed: false
        max_files: 5
        allocation_unit_size: 16384
      sub_config:
        slot: SDMMC_HOST_SLOT_1
        frequency: SDMMC_FREQ_DEFAULT
        bus_width: 1
        slot_flags: SDMMC_SLOT_FLAG_INTERNAL_PULLUP
        pins:
          clk: 39
          cmd: 38
          d0: 40
          cd: -1
          wp: -1

  # Single on-board addressable RGB status LED.
  - name: led_strip
    chip: ws2812
    type: led_strip
    sub_type: rmt
    version: 1.0.0
    init_skip: true
    config:
      strip_gpio_num: 48
      max_leds: 1
      led_model: LED_MODEL_WS2812
      color_component_format: LED_STRIP_COLOR_COMPONENT_FMT_GRB
      invert_out: false
      rmt:
        clk_src: RMT_CLK_SRC_DEFAULT
        resolution_hz: 10000000
        mem_block_symbols: 0
        with_dma: true

  - name: boot_button
    chip: gpio_button
    type: custom
    version: default
    init_skip: true
    config:
      gpio_num: 0
      active_level: 0

  - name: ttl_console
    chip: ch340c
    type: custom
    version: default
    init_skip: true
    config:
      tx_gpio_num: 43
      rx_gpio_num: 44
      baud_rate: 115200
      note: "UART0 console and flashing through the board's TTL USB-C port"

  - name: native_usb
    chip: esp32s3_native_usb
    type: custom
    version: default
    init_skip: true
    config:
      dm_gpio_num: 20
      dp_gpio_num: 19
      note: "Native USB/OTG connector; not selected as the primary console"
